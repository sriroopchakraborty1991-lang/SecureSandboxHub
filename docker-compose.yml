version: '3.8'

services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./packages/backend:/usr/src/app
      - /usr/src/app/node_modules
      - ./logs:/usr/src/app/logs
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://user:password@db:5432/mcp_db
      - JWT_SECRET=your-super-secret-jwt-key
    depends_on:
      - db
    networks:
      - mcp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "3000:3000"
    volumes:
      - ./packages/frontend:/usr/src/app
      - /usr/src/app/node_modules
      - frontend_build_cache:/usr/src/app/.vite
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001/api
      - NODE_OPTIONS=--max-old-space-size=4096
    depends_on:
      - backend
    networks:
      - mcp_network
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mcp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Simple Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - mcp_network


volumes:
  postgres_data:
  frontend_build_cache:

networks:
  mcp_network:
    driver: bridge

